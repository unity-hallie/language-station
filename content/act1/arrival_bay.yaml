id: arrival_bay
name: "[NAME OF THE FIRST PLACE. IT IS A BAY. FOR ARRIVING.]"
act: 1
gmGenerated: false

gm_hint: |
  Entry point. The player should feel welcomed but slightly off-footed.
  Yuen is trustworthy but evasive — she knows more than she says.
  The notice board is a tutorial object; reading it sets a flag.
  Do not generate additional options for Yuen here — this room is fully authored.
  The corridor forward leads deeper in; orientation is the tutorial branch.

description: |
  [YOU HAVE ARRIVED. SOMEWHERE. THE DETAILS ARE ATMOSPHERIC AND VAGUELY
  OMINOUS IN A WAY THAT SUGGESTS THEMES WILL OCCUR LATER. THERE IS A SMELL.
  IT MEANS SOMETHING. OTHER PEOPLE ARE ALSO HERE, ESTABLISHING THAT YOU ARE
  NOT ALONE. YET.]

  [A CORRIDOR GOES FORWARD. A DOOR IS TO THE LEFT. BOTH OF THESE ARE OPTIONS
  THE PLAYER CAN TAKE. THE PLAYER SHOULD TAKE ONE OF THEM. EVENTUALLY.]

  [THERE IS A WOMAN. SHE IS TALKING. THIS IS THE TUTORIAL NPC.]

exits:
  forward:
    roomId: corridor_a
  left:
    roomId: orientation_room

npcs:
  - id: dr_yuen
    name: "[AUTHORITY FIGURE, FEMALE, SCIENCE-FLAVORED]"
    description: "[SHE IS IN CHARGE. SHE KNOWS THINGS. SHE WILL NOT TELL YOU THE THINGS.]"
    dialog:
      entry: yuen_arrival_entry

interactables:
  - id: docking_notice
    name: "[SIGN ON WALL]"
    description: "[A PIECE OF PAPER TAPED TO A WALL. IT HAS BEEN THERE A WHILE. IT SHOWS.]"
    text: |
      [WELCOME MESSAGE WITH RULES THAT HINT AT DANGER.
      THE RULES INCLUDE AT LEAST ONE RULE THAT WILL BE BROKEN.
      THERE IS A SIGNATURE FROM SOMEONE OFFICIAL.
      INSTITUTION VIBES. VERY OFFICIAL. VERY FINE.]
    setFlag: read_docking_notice

dialog:
  yuen_arrival_entry:
    id: yuen_arrival_entry
    speaker: dr_yuen
    source: authored
    text: |
      "[THE AUTHORITY FIGURE SAYS SOMETHING REASSURING THAT IS ACTUALLY SLIGHTLY
      UNSETTLING IF YOU THINK ABOUT IT. SHE ACKNOWLEDGES THE JOURNEY.
      SHE TELLS YOU WHAT YOU FEEL IS NORMAL. YOU BEGIN TO WONDER IF IT IS NORMAL.]"
    options:
      - text: "[PLAYER ASKS THE OBVIOUS QUESTION ABOUT WHERE THEY ARE.]"
        source: authored
        next: yuen_what_is_this
      - text: "[PLAYER ASKS THE PRACTICAL QUESTION ABOUT HOW LONG THIS WILL TAKE.]"
        source: authored
        next: yuen_how_long
      - text: "[PLAYER SAYS NOTHING. PLAYER IS BEING ENIGMATIC OR POSSIBLY JUST TIRED.]"
        source: authored
        next: null

  yuen_what_is_this:
    id: yuen_what_is_this
    speaker: dr_yuen
    source: authored
    text: |
      "[SHE EXPLAINS THE PREMISE OF THE GAME. TECHNICALLY. IN A WAY THAT IS
      REASSURING ON THE SURFACE AND DEEPLY ALARMING IF YOU HAVE PLAYED GAMES BEFORE.
      SHE USES JARGON. THE JARGON IS REAL. THAT'S WORSE.]"

      "[SHE LOOKS AT SOMETHING. THE SOMETHING IS NOT THERE. OR IS IT.]"

      "[SHE TELLS YOU TO STAY WITH THE GROUP. THE GROUP WILL NOT HELP YOU.]"
    options:
      - text: "[PLAYER ASKS ABOUT THE JARGON.]"
        source: authored
        next: yuen_semantic_field
      - text: "[PLAYER ASKS ABOUT THE THING SHE LOOKED AT.]"
        source: authored
        next: yuen_nothing_there
      - text: "[PLAYER ACCEPTS THIS EXPLANATION AND MOVES ON LIKE A REASONABLE PERSON.]"
        source: authored
        next: null

  yuen_how_long:
    id: yuen_how_long
    speaker: dr_yuen
    source: authored
    text: |
      "[SHE GIVES A NUMBER. THE NUMBER IS PROVISIONAL. THE PROVISIONALITY
      IS ITSELF SUSPICIOUS. SHE DOES NOT SEEM TO FULLY BELIEVE THE NUMBER.
      THE PLAYER SHOULD NOT FULLY BELIEVE THE NUMBER EITHER.]"
    options:
      - text: "[PLAYER FOLLOWS UP ON THE SUSPICIOUS PROVISIONALITY.]"
        source: authored
        next: yuen_depends
      - text: "[PLAYER LETS IT GO. PLAYER HAS GIVEN UP ALREADY. GOOD INSTINCTS.]"
        source: authored
        next: null

  yuen_semantic_field:
    id: yuen_semantic_field
    speaker: dr_yuen
    source: authored
    text: |
      "[SHE EXPLAINS THE CENTRAL CONCEIT OF THE GAME IN POETIC LANGUAGE.
      IT SOUNDS LIKE PHILOSOPHY. IT IS ALSO LITERALLY TRUE IN THIS WORLD.
      THIS IS THE THEME. THE THEME HAS BEEN STATED. YOU MAY NOW HAVE FEELINGS.]"
    options:
      - text: "[PLAYER NODS. PLAYER MOVES ON. THE THEME FOLLOWS ANYWAY.]"
        source: authored
        next: null

  yuen_nothing_there:
    id: yuen_nothing_there
    speaker: dr_yuen
    source: authored
    text: |
      "[SHE LOOKS. THERE IS NOTHING THERE. THIS IS CONFIRMED. IT IS CONFIRMED
      IN A WAY THAT MAKES YOU FEEL THERE IS DEFINITELY SOMETHING THERE.
      SHE EXPLAINS HERSELF. THE EXPLANATION EXPLAINS NOTHING. THIS IS INTENTIONAL.]"
    options:
      - text: "[PLAYER NODS. THE NOD ACCOMPLISHES NOTHING. NOTHING WAS THERE. PROBABLY.]"
        source: authored
        next: null

  yuen_depends:
    id: yuen_depends
    speaker: dr_yuen
    source: authored
    text: |
      "[LONG PAUSE. THE PAUSE IS LOAD-BEARING. SHE THEN SAYS A THING
      THAT ANTHROPOMORPHIZES INFRASTRUCTURE IN AN OMINOUS WAY.]"
    options:
      - text: "[PLAYER PICKS UP ON THE ANTHROPOMORPHIZATION.]"
        source: authored
        next: yuen_cooperative
      - text: "[PLAYER DECIDES NOT TO PICK AT THIS PARTICULAR THREAD. COWARD. WISE.]"
        source: authored
        next: null

  yuen_cooperative:
    id: yuen_cooperative
    speaker: dr_yuen
    source: authored
    text: |
      "[SHE BACKTRACKS. SHE SAYS SHE MEANT HARDWARE. THE HARDWARE IS FINE.
      EVERYTHING IS FINE. SHE IS ALREADY WALKING AWAY.
      THE CONVERSATION IS OVER NOW. SHE HAS DECIDED.]"
    options:
      - text: "[PLAYER FOLLOWS. THERE IS NO OTHER OPTION. THERE NEVER WAS.]"
        source: authored
        next: null
