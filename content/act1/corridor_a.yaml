# ─────────────────────────────────────────────────────────────
# LANGUAGE STATION — Act 1, Room: Corridor A
# Human-authored. The first branching space — more exits than
# the player can immediately use. Relay Room is locked.
# ─────────────────────────────────────────────────────────────

id: corridor_a
name: "[HALLWAY. THE FIRST REAL ONE. IT CURVES. OMINOUSLY.]"
act: 1
gmGenerated: false

gm_hint: |
  The first room that feels like the station proper.
  The Relay Room door is locked — requires used_orientation_terminal.
  The GM may inject options for the wall panel interactable in later acts,
  particularly to introduce the Station's presence before Act 2.
  The corridor itself should feel slightly longer than it looks.
  There are no NPCs here by default — the GM may place one if narratively warranted.

description: |
  [THE CORRIDOR. IT CURVES. THE LIGHTS FLICKER IN A PATTERN THAT THE GAME
  WOULD LIKE YOU TO NOTICE. YOU HAVE NOTICED IT. GOOD. IT WAS DELIBERATE.
  THE FLICKERING SUGGESTS SOMETHING WITHOUT SPECIFYING WHAT. THIS IS CRAFT.]

  [THERE IS A LOCKED DOOR. THE DOOR IS IMPORTANT. THE DOOR IS LOCKED BECAUSE
  YOU DON'T HAVE CLEARANCE YET. THE AMBER GLOW IS THE GAME'S WAY OF SAYING
  "NOT YET BUT EVENTUALLY." ALSO BEHIND YOU IS THE PLACE YOU CAME FROM.
  ALSO AHEAD IS THE PLACE YOU ARE GOING.]

  [ON THE WALL: SOME LIGHTS. ONE OF THEM IS A COLOR. THE OTHER LIGHTS ARE ALSO
  COLORS. ONE OF THE COLORS IS NOT A COLOR. THIS WILL NOT BE ADDRESSED FURTHER
  AT THIS TIME BUT IT WILL BE ADDRESSED.]

exits:
  back:
    roomId: arrival_bay
  forward:
    roomId: commons
  right:
    roomId: relay_room
    requires: used_orientation_terminal
    lockedMessage: |
      [THE DOOR IS LOCKED. THE KEYPAD IS AMBER. AMBER MEANS NO.
      YOU NEED TO DO THE TUTORIAL THING FIRST. GO DO THE TUTORIAL THING.]

npcs: []

interactables:
  - id: indicator_panel
    name: "[PANEL OF LITTLE LIGHTS. STATUS LIGHTS. THE LIGHTS HAVE STATUS.]"
    description: |
      [MOST OF THE LIGHTS SAY EVERYTHING IS FINE. ONE LIGHT SAYS SOMETHING
      IS NOT FINE. THE NOT-FINE THING IS THE LOCKED ROOM. OF COURSE IT IS.
      THE REMAINING LIGHT IS A COLOR THAT DOES NOT HAVE A LABEL BECAUSE
      WHOEVER MADE THE PANEL DID NOT LABEL IT. OR COULD NOT LABEL IT.
      OR THE LABEL IS SOMEWHERE ELSE NOW. THE SPACE WHERE A LABEL WOULD GO
      IS PRESENT. THE LABEL IS NOT. THIS IS THE WHOLE SITUATION WITH THE LABEL.]

  - id: corridor_sign
    name: "[SIGN THAT TELLS YOU WHERE THINGS ARE. DIRECTIONS. THE SIGN OF DIRECTIONS.]"
    description: |
      [THE SIGN LISTS THE PLACES AND WHICH WAY TO GO TO GET TO THEM.
      THE PLACES INCLUDE: MORE OF THE STATION (FORWARD), WHERE YOU CAME FROM (BACK),
      AND THE LOCKED ROOM (LOCKED). THE SIGN IS HELPFUL. THE SIGN IS DOING ITS JOB.]

      [BELOW THE OFFICIAL SIGN CONTENT, WRITTEN BY HAND IN PENCIL, VERY SMALL:
      A NOTE THAT IMPLIES THE SIGN CANNOT BE TRUSTED. THE NOTE WAS WRITTEN BY SOMEONE.
      THE SOMEONE IS UNKNOWN. YOU SOMEHOW KNOW THE HANDWRITING IS NOT FROM ANYONE
      ON STAFF. YOU DO NOT KNOW HOW YOU KNOW THIS. THE GAME KNOWS HOW YOU KNOW THIS.
      THE GAME WILL NOT TELL YOU YET.]

dialog: {}
