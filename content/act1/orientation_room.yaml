# ─────────────────────────────────────────────────────────────
# LANGUAGE STATION — Act 1, Room: Orientation Room
# Human-authored. Tutorial room — teaches interaction patterns.
# ─────────────────────────────────────────────────────────────

id: orientation_room
name: "[THE ROOM WHERE THINGS ARE EXPLAINED. THE EXPLAINING ROOM.]"
act: 1
gmGenerated: false

gm_hint: |
  Tutorial space. Safe, well-lit, slightly over-explained.
  The contrast with the rest of the station should feel deliberate —
  like a stage set that was assembled quickly.
  Archivist Morel is the tutorial NPC: friendly, a little bureaucratic.
  The terminal puzzle here sets the flag that unlocks the relay_room exit
  in corridor_a. The GM may add options to Morel in later acts, but not here.

description: |
  [THE ROOM IS BRIGHT. THIS IS NOTABLE BECAUSE THINGS HAVE BEEN DIM.
  CHAIRS EXIST. PEOPLE ARE IN THE CHAIRS. A SCREEN IS BEING PROJECTED UPON.
  TABLETS ARE PRESENT. EVERYTHING HERE IS TRYING VERY HARD TO SEEM NORMAL.]

  [THERE ARE TWO THINGS ON THE WALL WORTH LOOKING AT. THERE IS ALSO A TERMINAL.
  THE TERMINAL WILL MATTER. YOU CAN TELL BECAUSE IT BLINKS PATIENTLY,
  LIKE A TERMINAL THAT KNOWS IT WILL MATTER.]

  [THE TUTORIAL NPC SEES YOU AND DOES THE FRIENDLY WAVE. HERE WE GO.]

exits:
  back:
    roomId: arrival_bay

npcs:
  - id: archivist_morel
    name: "[FRIENDLY BUREAUCRAT. THE SAFE ONE. FOR NOW.]"
    description: "[HE WORKS HERE. HE IS PLEASANT. HE HAS CLEARLY DONE THIS SPEECH MANY TIMES.]"
    dialog:
      entry: morel_entry

interactables:
  - id: quick_reference
    name: "[SHEET OF PAPER WITH RULES ON IT]"
    description: |
      [THE RULES. HERE ARE THE RULES. THE RULES INCLUDE: CORRIDORS CONNECT ROOMS
      (YOU MAY HAVE ALREADY NOTICED THIS), TERMINALS LOG THINGS (NOTED),
      IF SOMETHING IS WRONG WRITE IT DOWN DON'T FIX IT (OMINOUS),
      AND — THIS ONE IS DOING A LOT OF WORK — DO NOT ASK THE STATION QUESTIONS.
      THE STATION IS NOT A QUESTION-ANSWERING ENTITY. THE STATION IS A STATION.
      IT HAS ALREADY ANSWERED. YOU JUST DON'T KNOW WHAT THE QUESTION WAS.]
    setFlag: read_quick_reference

  - id: orientation_terminal
    name: "[COMPUTER. THE BLINKING ONE.]"
    description: |
      [THE TERMINAL DISPLAYS YOUR CLEARANCE LEVEL. YOUR CLEARANCE LEVEL IS LOW.
      THIS IS EXPECTED AND WILL PRESUMABLY CHANGE. THE TERMINAL ALSO GRANTS
      ACCESS TO THE PLACES YOU ARE ALLOWED TO GO, WHICH IS MOST PLACES BUT NOT
      THE IMPORTANT PLACE. THE IMPORTANT PLACE IS STAFF ONLY.]

      [BELOW ALL OF THAT, IN SMALLER TEXT, THE TERMINAL SAYS HELLO.
      THE TERMINAL SAYS HELLO TO YOU SPECIFICALLY.
      THE TUTORIAL NPC WILL HAVE THOUGHTS ABOUT THIS.]
    setFlag: used_orientation_terminal

dialog:
  morel_entry:
    id: morel_entry
    speaker: archivist_morel
    source: authored
    text: |
      "[THE FRIENDLY BUREAUCRAT WELCOMES YOU. HE CONGRATULATES YOU ON ARRIVING
      IN ONE PIECE, WHICH IS A THING HE SAYS EVERY TIME AND HAS NEVER REALLY
      THOUGHT ABOUT. HE TELLS YOU HIS NAME. HE POINTS AT THE TERMINAL.
      THE TERMINAL BLINKS. THIS IS ALL VERY NORMAL. PLEASE PROCEED.]"
    options:
      - text: "[PLAYER ASKS ABOUT THE LOCKED ROOM THEY WERE TOLD ABOUT.]"
        source: authored
        next: morel_relay_room
      - text: "[PLAYER REPORTS THAT THE TERMINAL SAID HELLO TO THEM PERSONALLY.]"
        source: authored
        next: morel_terminal_said_hello
        requires: used_orientation_terminal
      - text: "[PLAYER ACCEPTS THE TUTORIAL AND EXITS THE DIALOGUE TREE LIKE AN ADULT.]"
        source: authored
        next: null

  morel_relay_room:
    id: morel_relay_room
    speaker: archivist_morel
    source: authored
    text: |
      "[HE EXPLAINS THE LOCKED ROOM. THE EXPLANATION IS TECHNICALLY ACCURATE
      AND COMPLETELY UNSATISFYING. SOMETHING IS WRONG WITH IT. HE USES THE WORD
      UNRELIABLE. HE SMILES WHILE SAYING IT. THE SMILE IS NORMAL. THE SMILE IS FINE.
      HE SUGGESTS YOU WILL NEVER NEED TO GO IN THERE.
      YOU WILL DEFINITELY NEED TO GO IN THERE.]"
    options:
      - text: "[PLAYER ASKS FOR ELABORATION ON 'UNRELIABLE.']"
        source: authored
        next: morel_unreliable
      - text: "[PLAYER ACCEPTS THIS AND DOES NOT PUSH FURTHER. HEALTHY BOUNDARIES.]"
        source: authored
        next: null

  morel_unreliable:
    id: morel_unreliable
    speaker: archivist_morel
    source: authored
    text: |
      "[HE ELABORATES. THE ELABORATION USES JARGON FROM EARLIER IN THE GAME.
      HE TREATS THE JARGON AS IF IT EXPLAINS THINGS. IT DOES NOT EXPLAIN THINGS.
      THERE IS A BRIEF PAUSE. HE GIVES YOU THE PROTOCOL. THE PROTOCOL IS:
      WRITE IT DOWN. THAT'S THE WHOLE PROTOCOL. WRITE IT DOWN.]"
    options:
      - text: "[PLAYER CONFIRMS RECEIPT OF PROTOCOL. DOCUMENT THINGS. UNDERSTOOD. MOVING ON.]"
        source: authored
        next: null

  morel_terminal_said_hello:
    id: morel_terminal_said_hello
    speaker: archivist_morel
    source: authored
    text: |
      "[HE LOOKS AT THE TERMINAL. HE LOOKS AT YOU. HE SAYS IT WAS A GLITCH.
      HE SAYS THIS WITHOUT HESITATION. HE HAS SAID THIS BEFORE.
      HE HAS SAID THIS MANY TIMES BEFORE. HE WILL SAY IT AGAIN.
      HE SEEMS FINE. HE IS FINE. THE TERMINAL IS A TERMINAL. IT GLITCHES.
      THIS IS THE OFFICIAL EXPLANATION. PLEASE ACCEPT THE OFFICIAL EXPLANATION.]"
    options:
      - text: "[PLAYER ACCEPTS THE OFFICIAL EXPLANATION. PLAYER IS ADAPTABLE.]"
        source: authored
        next: null
      - text: "[PLAYER SUGGESTS THE TERMINAL SEEMED SINCERE. PLAYER IS GOING TO HAVE A HARD TIME.]"
        source: authored
        next: morel_meant_it

  morel_meant_it:
    id: morel_meant_it
    speaker: archivist_morel
    source: authored
    text: |
      "[LONG PAUSE. HE LOOKS AT THE PLAYER CAREFULLY, AS IF ASSESSING SOMETHING.
      THEN HE GIVES THE PROTOCOL AGAIN. JUST THE PROTOCOL. NOTHING ELSE.
      HE DOES NOT SAY ANYTHING ELSE AFTER THAT. THE CONVERSATION IS OVER.
      HE HAS DECIDED THE CONVERSATION IS OVER. IT IS OVER NOW.]"
    options:
      - text: "[PLAYER NODS. THE NOD IS ALSO OVER NOW.]"
        source: authored
        next: null
